<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼각비 퀴즈 게임</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #1a472a; /* 칠판 색상 */
            color: #f8f9fa;
            overflow-x: hidden;
        }
        .chalk-border {
            border: 4px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .chalk-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid white;
            transition: all 0.2s;
        }
        .chalk-btn:hover {
            background: white;
            color: #1a472a;
            transform: scale(1.05);
        }
        /* 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }
        .float-anim {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s forwards;
            z-index: 50;
        }
        .text-yellow { color: #facc15; }
        .text-red { color: #f87171; }
        /* 카텍스 수식 폰트 크기 조정 */
        .katex { font-size: 1.5em !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 1. 랜딩 (메인 홈) 화면 -->
    <div id="landing-screen" class="w-full max-w-2xl chalk-border p-8 flex flex-col items-center text-center space-y-8 relative">
        <h1 class="text-4xl md:text-5xl text-yellow-300 drop-shadow-md">삼각비 마스터에 도전하세요!</h1>
        <p class="text-xl text-gray-200">중3 수학 특수각의 삼각비 (0°, 30°, 45°, 60°, 90°)</p>
        
        <div class="w-full max-w-sm flex flex-col space-y-4">
            <input type="text" id="nickname-input" placeholder="닉네임을 입력하세요" class="w-full p-4 text-xl text-gray-900 rounded-lg outline-none text-center font-sans" maxlength="10">
            <button onclick="startGame()" class="chalk-btn p-4 text-2xl rounded-lg font-bold">게임 시작하기</button>
            <button onclick="showLeaderboard()" class="p-2 text-lg text-gray-300 hover:text-white underline underline-offset-4">실시간 랭킹 보기</button>
        </div>
    </div>

    <!-- 2. 게임 플레이 화면 -->
    <div id="game-screen" class="hidden w-full max-w-2xl chalk-border p-6 flex flex-col relative">
        <!-- 상태바 -->
        <div class="flex justify-between items-center mb-6 border-b-2 border-white/30 pb-4">
            <div class="text-xl"><span id="player-name" class="text-yellow-300"></span>님</div>
            <div class="text-2xl font-bold">점수: <span id="score" class="text-yellow-300">0</span></div>
        </div>
        
        <!-- 타이머 -->
        <div class="w-full bg-gray-700 rounded-full h-6 mb-8 relative overflow-hidden">
            <div id="timer-bar" class="bg-yellow-400 h-6 rounded-full transition-all duration-1000 ease-linear" style="width: 100%"></div>
            <div class="absolute inset-0 flex items-center justify-center text-sm text-gray-900 font-bold" id="timer-text">30초</div>
        </div>

        <!-- 퀴즈 영역 -->
        <div class="flex-1 flex flex-col items-center justify-center space-y-10 py-8">
            <div id="question-container" class="text-4xl md:text-5xl bg-black/20 p-8 rounded-2xl w-full text-center min-h-[160px] flex items-center justify-center">
                <!-- KaTeX 수식 들어갈 곳 -->
            </div>
            
            <div class="grid grid-cols-2 gap-4 w-full" id="choices-container">
                <!-- 선택지 버튼들 -->
            </div>
        </div>
        
        <!-- 플로팅 이펙트 영역 -->
        <div id="effect-container" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
    </div>

    <!-- 3. 결과 및 랭킹 화면 -->
    <div id="result-screen" class="hidden w-full max-w-2xl chalk-border p-8 flex flex-col items-center text-center space-y-6">
        <h2 class="text-4xl text-yellow-300">게임 종료!</h2>
        <div class="text-2xl space-y-2 bg-black/20 p-6 rounded-xl w-full">
            <p><span id="result-name" class="font-bold text-white"></span>님의 성적</p>
            <p class="text-3xl text-yellow-400 mt-2 font-bold" id="result-score">0 점</p>
            <p class="text-lg text-gray-300">맞힌 문제: <span id="result-correct">0</span>개</p>
        </div>

        <div class="flex gap-4 w-full justify-center">
            <button onclick="showReview()" class="chalk-btn flex-1 py-3 text-xl rounded-lg">오답 노트 보기</button>
            <button onclick="goHome()" class="chalk-btn flex-1 py-3 text-xl rounded-lg">메인으로</button>
        </div>

        <!-- 리더보드 -->
        <div class="w-full mt-6">
            <h3 class="text-2xl text-yellow-300 mb-4 border-b-2 border-white/30 pb-2">🏆 명예의 전당 (Top 10)</h3>
            <ul id="leaderboard-list" class="space-y-2 text-lg text-left bg-black/20 p-4 rounded-xl max-h-60 overflow-y-auto">
                <!-- 랭킹 리스트 -->
            </ul>
        </div>
    </div>

    <!-- 오답 노트 모달 -->
    <div id="review-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="chalk-border bg-[#1a472a] w-full max-w-2xl max-h-[80vh] flex flex-col p-6 relative">
            <button onclick="closeReview()" class="absolute top-4 right-4 text-3xl text-gray-300 hover:text-white">&times;</button>
            <h2 class="text-3xl text-yellow-300 mb-6 border-b-2 border-white/30 pb-2 text-center">오답 노트</h2>
            <div id="review-list" class="overflow-y-auto space-y-4 pr-2">
                <!-- 오답 리스트 -->
            </div>
        </div>
    </div>

    <!-- 메인 로직 스크립트 -->
    <script>
        // --- 퀴즈 데이터 ---
        const quizBank = [
            // 쉬움
            { q: "\\sin 30^\\circ", a: "\\frac{1}{2}", choices: ["\\frac{1}{2}", "\\frac{\\sqrt{2}}{2}", "\\frac{\\sqrt{3}}{2}", "1"] },
            { q: "\\cos 45^\\circ", a: "\\frac{\\sqrt{2}}{2}", choices: ["\\frac{1}{2}", "\\frac{\\sqrt{2}}{2}", "\\frac{\\sqrt{3}}{2}", "1"] },
            { q: "\\tan 60^\\circ", a: "\\sqrt{3}", choices: ["\\frac{\\sqrt{3}}{3}", "1", "\\sqrt{3}", "0"] },
            { q: "\\sin 90^\\circ", a: "1", choices: ["0", "\\frac{1}{2}", "1", "\\sqrt{2}"] },
            { q: "\\cos 0^\\circ", a: "1", choices: ["0", "\\frac{1}{2}", "1", "\\frac{\\sqrt{3}}{2}"] },
            { q: "\\tan 45^\\circ", a: "1", choices: ["0", "\\frac{\\sqrt{3}}{3}", "1", "\\sqrt{3}"] },
            { q: "\\sin 60^\\circ", a: "\\frac{\\sqrt{3}}{2}", choices: ["\\frac{1}{2}", "\\frac{\\sqrt{2}}{2}", "\\frac{\\sqrt{3}}{2}", "1"] },
            { q: "\\cos 30^\\circ", a: "\\frac{\\sqrt{3}}{2}", choices: ["\\frac{1}{2}", "\\frac{\\sqrt{2}}{2}", "\\frac{\\sqrt{3}}{2}", "1"] },
            { q: "\\sin 0^\\circ", a: "0", choices: ["0", "1", "\\frac{1}{2}", "\\frac{\\sqrt{2}}{2}"] },
            { q: "\\cos 90^\\circ", a: "0", choices: ["0", "1", "\\frac{1}{2}", "\\frac{\\sqrt{3}}{2}"] },
            // 보통
            { q: "\\sin 30^\\circ + \\cos 60^\\circ", a: "1", choices: ["0", "\\frac{1}{2}", "1", "\\sqrt{2}"] },
            { q: "\\sin 45^\\circ + \\cos 45^\\circ", a: "\\sqrt{2}", choices: ["1", "\\sqrt{2}", "\\frac{\\sqrt{2}}{2}", "2"] },
            { q: "\\tan 45^\\circ + \\sin 90^\\circ", a: "2", choices: ["0", "1", "2", "\\sqrt{3}"] },
            { q: "\\cos 0^\\circ - \\sin 90^\\circ", a: "0", choices: ["0", "1", "-1", "\\frac{1}{2}"] },
            { q: "\\tan 60^\\circ - \\tan 30^\\circ", a: "\\frac{2\\sqrt{3}}{3}", choices: ["\\frac{\\sqrt{3}}{3}", "\\frac{2\\sqrt{3}}{3}", "\\sqrt{3}", "0"] },
            { q: "\\sin 60^\\circ + \\cos 30^\\circ", a: "\\sqrt{3}", choices: ["1", "\\sqrt{2}", "\\sqrt{3}", "2"] },
            // 어려움
            { q: "\\sin^2 45^\\circ + \\cos^2 45^\\circ", a: "1", choices: ["0", "\\frac{1}{2}", "1", "2"] },
            { q: "\\tan 30^\\circ \\times \\tan 60^\\circ", a: "1", choices: ["0", "\\frac{1}{3}", "1", "\\sqrt{3}"] },
            { q: "\\sin 60^\\circ \\times \\cos 30^\\circ", a: "\\frac{3}{4}", choices: ["\\frac{1}{4}", "\\frac{1}{2}", "\\frac{3}{4}", "1"] },
            { q: "2\\sin 30^\\circ + \\sqrt{2}\\cos 45^\\circ", a: "2", choices: ["1", "2", "\\sqrt{2}", "3"] },
        ];

        // --- 전역 상태 변수 ---
        let currentScore = 0;
        let correctAnswers = 0;
        let timeLeft = 30;
        let timerInterval = null;
        let playerName = "";
        let currentQuestion = null;
        let wrongQuestions = []; // { q, a, userA }

        // --- DOM 요소 ---
        const screens = {
            landing: document.getElementById('landing-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen')
        };
        const timerBar = document.getElementById('timer-bar');
        const timerText = document.getElementById('timer-text');
        const scoreEl = document.getElementById('score');
        const effectContainer = document.getElementById('effect-container');
        const reviewModal = document.getElementById('review-modal');

        // --- 함수들 ---

        function switchScreen(screenId) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[screenId].classList.remove('hidden');
        }

        function startGame() {
            const input = document.getElementById('nickname-input').value.trim();
            if (!input) {
                alert("닉네임을 입력해주세요!");
                return;
            }
            playerName = input;
            document.getElementById('player-name').innerText = playerName;
            
            // 초기화
            currentScore = 0;
            correctAnswers = 0;
            timeLeft = 30;
            wrongQuestions = [];
            updateScore();
            updateTimerDisplay();
            
            switchScreen('game');
            nextQuestion();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            if (timeLeft < 0) timeLeft = 0;
            timerText.innerText = `${timeLeft}초`;
            let percentage = (timeLeft / 30) * 100;
            if (percentage > 100) percentage = 100;
            timerBar.style.width = `${percentage}%`;
            
            if (timeLeft <= 5) {
                timerBar.classList.replace('bg-yellow-400', 'bg-red-500');
            } else {
                timerBar.classList.replace('bg-red-500', 'bg-yellow-400');
            }
        }

        function updateScore() {
            scoreEl.innerText = currentScore;
        }

        function nextQuestion() {
            // 랜덤 문제 선택
            const randomIndex = Math.floor(Math.random() * quizBank.length);
            currentQuestion = quizBank[randomIndex];
            
            // 문제 렌더링 (KaTeX)
            const qContainer = document.getElementById('question-container');
            katex.render(currentQuestion.q, qContainer, { throwOnError: false, displayMode: true });

            // 선택지 섞기
            const shuffledChoices = [...currentQuestion.choices].sort(() => Math.random() - 0.5);
            
            // 선택지 버튼 렌더링
            const cContainer = document.getElementById('choices-container');
            cContainer.innerHTML = '';
            shuffledChoices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'chalk-btn py-4 md:py-6 text-xl md:text-2xl rounded-xl';
                btn.onclick = () => handleAnswer(choice);
                // 선택지도 KaTeX 렌더링
                katex.render(choice, btn, { throwOnError: false });
                cContainer.appendChild(btn);
            });
        }

        function handleAnswer(selected) {
            if (selected === currentQuestion.a) {
                // 정답
                currentScore += 100;
                correctAnswers++;
                timeLeft += 10;
                showEffect('+10s', 'text-yellow');
                updateScore();
            } else {
                // 오답
                timeLeft -= 5;
                showEffect('-5s', 'text-red');
                screens.game.classList.add('shake');
                setTimeout(() => screens.game.classList.remove('shake'), 300);
                
                wrongQuestions.push({
                    q: currentQuestion.q,
                    a: currentQuestion.a,
                    userA: selected
                });
            }
            updateTimerDisplay();
            
            if (timeLeft > 0) {
                nextQuestion();
            } else {
                endGame();
            }
        }

        function showEffect(text, colorClass) {
            const el = document.createElement('div');
            el.className = `float-anim ${colorClass}`;
            el.innerText = text;
            effectContainer.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('result-name').innerText = playerName;
            document.getElementById('result-score').innerText = `${currentScore} 점`;
            document.getElementById('result-correct').innerText = correctAnswers;
            
            saveScore();
            renderLeaderboard();
            switchScreen('result');
        }

        // --- 로컬 스토리지 랭킹 ---
        function saveScore() {
            const newScore = { name: playerName, score: currentScore, date: new Date().toLocaleDateString() };
            let scores = JSON.parse(localStorage.getItem('trigScores')) || [];
            scores.push(newScore);
            scores.sort((a, b) => b.score - a.score);
            scores = scores.slice(0, 10); // 상위 10개만 유지
            localStorage.setItem('trigScores', JSON.stringify(scores));
        }

        function renderLeaderboard() {
            const scores = JSON.parse(localStorage.getItem('trigScores')) || [];
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            
            if (scores.length === 0) {
                list.innerHTML = '<li class="text-center text-gray-400">아직 기록이 없습니다.</li>';
                return;
            }

            scores.forEach((s, idx) => {
                const li = document.createElement('li');
                li.className = `flex justify-between items-center p-2 border-b border-white/10 ${idx === 0 ? 'text-yellow-300 font-bold text-xl' : ''}`;
                li.innerHTML = `<span>${idx + 1}. ${s.name}</span> <span>${s.score}점</span>`;
                list.appendChild(li);
            });
        }

        function showLeaderboard() {
            document.getElementById('result-name').parentElement.style.display = 'none';
            document.getElementById('result-score').style.display = 'none';
            document.getElementById('result-correct').parentElement.style.display = 'none';
            document.querySelector('#result-screen h2').innerText = '실시간 랭킹';
            renderLeaderboard();
            switchScreen('result');
        }

        function goHome() {
            // 결과창 UI 복구
            document.getElementById('result-name').parentElement.style.display = 'block';
            document.getElementById('result-score').style.display = 'block';
            document.getElementById('result-correct').parentElement.style.display = 'block';
            document.querySelector('#result-screen h2').innerText = '게임 종료!';
            switchScreen('landing');
        }

        // --- 오답 노트 ---
        function showReview() {
            const list = document.getElementById('review-list');
            list.innerHTML = '';
            
            if (wrongQuestions.length === 0) {
                list.innerHTML = '<div class="text-center text-yellow-300 text-xl mt-10">틀린 문제가 없습니다! 완벽해요! 🎉</div>';
            } else {
                wrongQuestions.forEach((wq, idx) => {
                    const item = document.createElement('div');
                    item.className = 'bg-black/30 p-4 rounded-lg flex flex-col items-center text-center space-y-3';
                    
                    const qDiv = document.createElement('div');
                    qDiv.className = 'text-2xl mb-2';
                    katex.render(wq.q, qDiv, { throwOnError: false });
                    
                    const ansDiv = document.createElement('div');
                    ansDiv.className = 'flex gap-8 justify-center w-full text-lg';
                    ansDiv.innerHTML = `
                        <div class="flex flex-col items-center">
                            <span class="text-gray-400 text-sm mb-1">내 선택</span>
                            <span class="text-red-400 line-through" id="userA-${idx}"></span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-gray-400 text-sm mb-1">정답</span>
                            <span class="text-yellow-300" id="corrA-${idx}"></span>
                        </div>
                    `;
                    
                    item.appendChild(qDiv);
                    item.appendChild(ansDiv);
                    list.appendChild(item);
                    
                    // 수식 렌더링
                    katex.render(wq.userA, document.getElementById(`userA-${idx}`), { throwOnError: false });
                    katex.render(wq.a, document.getElementById(`corrA-${idx}`), { throwOnError: false });
                });
            }
            reviewModal.classList.remove('hidden');
        }

        function closeReview() {
            reviewModal.classList.add('hidden');
        }

    </script>
</body>
</html>
